<body>
  <header class="app-header">
    <h1>Able–Baker Queue Simulation</h1>
    <p>Two-server discrete event simulation</p>
  </header>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/script.js"></script>

  <section class="control-card">
    <h2>Simulation Control</h2>
    <input
      type="number"
      id="customersToAdd"
      min="1"
      placeholder="Enter number of customers"
    />
    <div class="button-row">
      <button id="simulateBtn" onclick="startSimulation()">Simulate</button>
      <button class="secondary" onclick="resetSimulation()">Reset</button>
    </div>
  </section>

  <section id="simulationWrapper">
    <table id="simulationTable">
      <thead>
        <tr>
          <th>Cust</th>
          <th>IAT</th>
          <th>Arrival</th>
          <th>Server</th>
          <th colspan="3">Able</th>
          <th colspan="3">Baker</th>
          <th>Delay</th>
          <th>System</th>
        </tr>
        <tr class="sub-head">
          <th></th>
          <th></th>
          <th></th>
          <th></th>
          <th>Begin</th>
          <th>Svc</th>
          <th>End</th>
          <th>Begin</th>
          <th>Svc</th>
          <th>End</th>
          <th></th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="resultsWrapper">
    <h2>Summary</h2>
    <div class="result-grid">
      <div class="result-card">
        <span>Avg Waiting Time</span>
        <strong id="avgWaiting"></strong>
      </div>
      <div class="result-card">
        <span>Avg IAT</span>
        <strong id="avgIAT"></strong>
      </div>
      <div class="result-card">
        <span>Avg Able Service</span>
        <strong id="avgServiceAble"></strong>
      </div>
      <div class="result-card">
        <span>Avg Baker Service</span>
        <strong id="avgServiceBaker"></strong>
      </div>
      <div class="result-card highlight">
        <span>Avg Wait (Waiting Only)</span>
        <strong id="avgWaitWait"></strong>
      </div>
    </div>
  </section>

  <script src="js/script.js"></script>
</body>
